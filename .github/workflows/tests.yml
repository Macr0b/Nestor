# Vérifie chaque envoi sur GitHub (onglet « Actions » du dépôt) : formatage du code, tests, version Claude.
name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Outils (prettier, esbuild)
        run: npm ci
      - name: Navigateur pour les tests d'interface
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Code bien formaté
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: La version Claude se fabrique
        run: npm run build:claude
